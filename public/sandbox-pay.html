<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sandbox Payment</title><style>body{font-family:system-ui;background:#eef5fb;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:30px;border-radius:18px;width:min(420px,90vw);box-shadow:0 10px 40px #0001}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0879d1;color:#fff;font-weight:800}</style></head><body><div class="card"><h1>Sandbox Payment</h1><p>หน้านี้ใช้ทดสอบเท่านั้น ไม่ตัดเงินจริง</p><button class="btn" id="pay">จำลองการชำระเงินสำเร็จ</button></div><script>const id=new URLSearchParams(location.search).get('order');document.querySelector('#pay').onclick=async()=>{const r=await fetch('/api/sandbox/pay/'+id,{method:'POST'});const d=await r.json();if(!r.ok)return alert(d.error);location.href='/payment-success.html?order='+id}</script></body></html>
