<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMO HUB Shop</title><style>body{font-family:system-ui;margin:0;background:#f5f8fc;color:#123}header{background:#073a73;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}main{max-width:1000px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000b}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}input,textarea{width:100%;padding:12px;border:1px solid #ccd8e5;border-radius:9px;box-sizing:border-box;margin:6px 0}.btn{background:#0879d1;color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;width:100%}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.muted{color:#718096}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>PROMO HUB</b><span>Secure Checkout</span></header><main><div class="grid"><section class="card"><h1>ยืนยันคำสั่งซื้อ</h1><div id="items"></div><hr><h3>ข้อมูลจัดส่ง</h3><form id="checkout"><input name="name" placeholder="ชื่อ-นามสกุล" required><input name="email" type="email" placeholder="อีเมล" required><input name="phone" placeholder="เบอร์โทรศัพท์" required><textarea name="address" rows="4" placeholder="ที่อยู่จัดส่ง" required></textarea><button class="btn">ไปหน้าชำระเงิน</button></form></section><aside class="card"><h2>สรุปคำสั่งซื้อ</h2><div id="summary" class="muted"></div></aside></div></main><script>const qs=new URLSearchParams(location.search);const product=Number(qs.get('product'));let items=JSON.parse(localStorage.getItem('ph_cart')||'[]');if(product&&!items.some(x=>x.productId===product))items.push({productId:product,qty:1});async function load(){const ps=await (await fetch('/api/products')).json();items=items.map(x=>{const p=ps.find(y=>y.id===x.productId);return p?{...x,p}:null}).filter(Boolean);document.querySelector('#items').innerHTML=items.map(x=>`<div class="item"><span>${x.p.name} × ${x.qty}</span><b>฿${(x.p.price*x.qty).toLocaleString()}</b></div>`).join('');const sub=items.reduce((s,x)=>s+x.p.price*x.qty,0),ship=sub>=1000?0:50;document.querySelector('#summary').innerHTML=`สินค้า ฿${sub.toLocaleString()}<br>ค่าจัดส่ง ฿${ship}<hr><strong>รวม ฿${(sub+ship).toLocaleString()}</strong>`;localStorage.setItem('ph_cart',JSON.stringify(items.map(x=>({productId:x.productId,qty:x.qty})))});};load();document.querySelector('#checkout').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/public/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,customer:f})});const d=await r.json();if(!r.ok)return alert(d.error||'เกิดข้อผิดพลาด');localStorage.removeItem('ph_cart');location.href=d.payment.checkoutUrl};</script></body></html>
