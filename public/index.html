<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMO HUB 2.3</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#102a43}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #e5edf5;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:22px;color:#0b4ea2}.brand span{color:#18a0ff}.user{display:flex;gap:12px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#d9efff;display:grid;place-items:center}.layout{display:flex}.side{width:230px;background:#073a73;color:#fff;min-height:calc(100vh - 64px);padding:18px 12px;position:sticky;top:64px;align-self:flex-start}.side button{width:100%;background:transparent;color:#dcecff;text-align:left;padding:13px 14px;border-radius:10px;margin:3px 0}.side button.active,.side button:hover{background:#0d82df;color:#fff}.main{flex:1;padding:24px;max-width:1400px;margin:auto}.hero{background:linear-gradient(120deg,#dff3ff,#fff);border-radius:18px;padding:26px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#567}.hero .pill{background:#fff;padding:10px 14px;border-radius:999px;font-weight:800;color:#0879c9}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e4edf5;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(22,57,87,.04)}.metric b{display:block;font-size:28px;margin-top:7px}.muted{color:#718096}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product img{width:100%;height:180px;object-fit:cover;border-radius:12px;background:#edf6fb}.btn{background:#0879d1;color:#fff;padding:11px 16px;border-radius:10px;font-weight:800}.btn.secondary{background:#e9f4ff;color:#0879d1}.btn.danger{background:#ffe9e9;color:#c53030}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.stack{display:grid;gap:12px}.form{max-width:520px;margin:60px auto}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #cbd8e5;border-radius:10px;background:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e8eef4;text-align:left}.notice{padding:12px;border-radius:10px;background:#fff7db;color:#795700}.ok{background:#e8fff5;color:#08754d}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{padding:9px 13px;border-radius:9px;background:#e9f4ff;color:#0879d1}.tabs button.active{background:#0879d1;color:#fff}.media{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.media .card{padding:8px}.media img,.media video{width:100%;height:150px;object-fit:cover;border-radius:9px}.linkbox{display:flex;gap:8px}.linkbox input{flex:1}.toast{position:fixed;right:20px;bottom:20px;background:#102a43;color:#fff;padding:13px 16px;border-radius:10px;z-index:20;box-shadow:0 8px 30px #0002}.authwrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f6ff,#fff)}.authbox{width:min(420px,92vw);background:#fff;padding:30px;border-radius:20px;box-shadow:0 15px 60px #0b4ea220}.authbox h1{margin-top:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin{border-left:4px solid #7b61ff}.small{font-size:13px}@media(max-width:900px){.side{display:none}.main{padding:15px}.grid4,.products{grid-template-columns:1fr 1fr}.media{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid4,.products,.media,.split{grid-template-columns:1fr}.top{padding:0 12px}.hero{display:block}.hero h1{font-size:24px}.table{font-size:13px}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s), root=$('#root');let me=null;
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'เกิดข้อผิดพลาด');return d}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2800)}
async function boot(){try{me=await api('/api/me');renderApp()}catch{renderAuth()}}
function renderAuth(){root.innerHTML=`<div class="authwrap"><div class="authbox"><div class="brand">PROMO <span>HUB</span></div><h1>เข้าสู่ระบบ</h1><p class="muted">แพลตฟอร์มโปรโมทสินค้าและรับค่าคอมมิชชัน</p><form id="login" class="stack"><input name="email" type="email" placeholder="อีเมล" required><input name="password" type="password" placeholder="รหัสผ่าน" required><button class="btn">เข้าสู่ระบบ</button></form><hr><button class="btn secondary" id="reg">สมัครสมาชิก</button><p class="small muted">บัญชีทดลอง Admin: admin@promohub.local / admin123</p></div></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);me=(await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))})).user;renderApp()}catch(x){toast(x.message)}};$('#reg').onclick=renderRegister}
function renderRegister(){root.innerHTML=`<div class="authwrap"><div class="authbox"><div class="brand">PROMO <span>HUB</span></div><h1>สมัครสมาชิก</h1><form id="regform" class="stack"><input name="name" placeholder="ชื่อ-นามสกุล" required><input name="email" type="email" placeholder="อีเมล" required><input name="password" type="password" minlength="8" placeholder="รหัสผ่านอย่างน้อย 8 ตัว" required><button class="btn">สมัครสมาชิก</button></form><button class="btn secondary" id="back">กลับเข้าสู่ระบบ</button></div></div>`;$('#regform').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);toast((await api('/api/register',{method:'POST',body:JSON.stringify(Object.fromEntries(f))})).message);renderAuth()}catch(x){toast(x.message)}};$('#back').onclick=renderAuth}
function shell(content,active='home'){root.innerHTML=`<div class="app"><header class="top"><div class="brand">PROMO <span>HUB</span></div><div class="user"><span>${me.name}</span><div class="avatar">👤</div><button class="btn secondary" id="logout">ออกจากระบบ</button></div></header><div class="layout"><aside class="side"><button data-p="home">🏠 Dashboard</button><button data-p="products">🛍️ สินค้า</button><button data-p="media">📣 สื่อโปรโมท</button><button data-p="links">🔗 ลิงก์ของฉัน</button><button data-p="stats">📊 สถิติ</button><button data-p="wallet">💰 Wallet / ถอนเงิน</button>${me.role==='admin'?'<hr><button data-p="admin">⚙️ Admin</button>':''}</aside><main class="main">${content}</main></div></div>`;document.querySelectorAll('.side button[data-p]').forEach(b=>{if(b.dataset.p===active)b.classList.add('active');b.onclick=()=>route(b.dataset.p)});$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});me=null;renderAuth()}}
async function route(p){if(p==='home')return home();if(p==='products')return products();if(p==='media')return media();if(p==='links')return links();if(p==='stats')return stats();if(p==='wallet')return wallet();if(p==='admin')return admin()}
async function home(){const d=await api('/api/dashboard');shell(`<div class="hero"><div><h1>สวัสดีครับ ${me.name} 👋</h1><p>เริ่มโปรโมทสินค้า สร้างยอดขาย และสะสมค่าคอมมิชชันได้จากที่นี่</p></div><div class="pill">บัญชี: ${me.status==='approved'?'อนุมัติแล้ว':'รออนุมัติ'}</div></div><div class="grid4"><div class="card metric">🖱️ คลิก<b>${d.clicks.toLocaleString()}</b><span class="muted">ทั้งหมด</span></div><div class="card metric">🛒 ออเดอร์<b>${d.orders.toLocaleString()}</b><span class="muted">ชำระแล้ว</span></div><div class="card metric">💵 ยอดขาย<b>฿${d.sales.toLocaleString()}</b><span class="muted">จากการแนะนำ</span></div><div class="card metric">💰 พร้อมถอน<b>฿${d.commissionAvailable.toLocaleString()}</b><span class="muted">รอจ่าย ฿${d.commissionPending.toLocaleString()}</span></div></div><br><div class="card"><div class="row"><h2>สินค้าแนะนำ</h2><button class="btn" onclick="route('products')">ดูสินค้าทั้งหมด</button></div><div id="homeproducts" class="products"></div></div>`,'home');const ps=await api('/api/products');$('#homeproducts').innerHTML=ps.slice(0,3).map(productCard).join('')}
function productCard(p){return `<div class="card product"><img src="${p.image||'https://placehold.co/600x360/eaf6ff/0879d1?text=PROMO+HUB'}"><h3>${p.name}</h3><p class="muted">${p.description||'รายละเอียดสินค้า'}</p><div class="row"><b>฿${p.price.toLocaleString()}</b><span class="small">คอมฯ ${p.commission_rate}%</span></div><br><button class="btn" onclick="startPromo(${p.id})">เริ่มโปรโมท</button></div>`}
async function products(){const ps=await api('/api/products');shell(`<div class="row"><div><h1>สินค้าทั้งหมด</h1><p class="muted">เลือกสินค้าที่ต้องการโปรโมท</p></div></div><div class="products">${ps.map(productCard).join('')}</div>`,'products')}
async function startPromo(id){try{const d=await api('/api/clicks',{method:'POST',body:JSON.stringify({productId:id})});await navigator.clipboard?.writeText(d.link);toast('สร้างลิงก์แล้ว และคัดลอกให้เรียบร้อย');route('links')}catch(e){toast(e.message)}}
async function links(){const rows=await api('/api/links');shell(`<h1>ลิงก์โปรโมทของฉัน</h1><p class="muted">แต่ละสินค้ามีลิงก์เฉพาะตัวสำหรับติดตามยอดขาย</p><div class="stack">${rows.map(x=>`<div class="card"><div class="row"><div><h3>${x.name}</h3><div class="small muted">คอมมิชชัน ${x.commission_rate}% • คลิก ${x.clicks} • ออเดอร์ ${x.orders} • ยอดขาย ฿${Number(x.sales).toLocaleString()}</div></div><button class="btn" onclick="copyLink('${x.link}')">คัดลอกลิงก์</button></div><br><div class="linkbox"><input readonly value="${x.link}"><button class="btn secondary" onclick="window.open('${x.link}','_blank')">ทดสอบ</button></div></div>`).join('')}</div>`,'links')}
function copyLink(x){navigator.clipboard?.writeText(x);toast('คัดลอกลิงก์แล้ว')}
async function media(){const ps=await api('/api/products');const all=[];for(const p of ps){const m=await api('/api/products/'+p.id+'/media');m.forEach(x=>all.push({...x,product:p.name}))}shell(`<h1>ศูนย์สื่อโปรโมท</h1><p class="muted">รูป วิดีโอ และข้อความพร้อมใช้สำหรับโพสต์</p><div class="media">${all.length?all.map(x=>`<div class="card">${x.type==='video'?`<video src="${x.url}" controls></video>`:`<img src="${x.url}">`}<b>${x.title}</b><div class="small muted">${x.product}</div><button class="btn secondary" style="width:100%;margin-top:8px" onclick="copyLink('${encodeURIComponent(x.caption||x.url)}')">คัดลอกข้อความ/ลิงก์</button></div>`).join(''):'<div class="notice">ยังไม่มีสื่อที่เผยแพร่</div>'}</div>`,'media')}
async function stats(){const d=await api('/api/dashboard');const orders=await api('/api/orders');shell(`<h1>สถิติการโปรโมท</h1><div class="grid4"><div class="card metric">คลิก<b>${d.clicks}</b></div><div class="card metric">ออเดอร์<b>${d.orders}</b></div><div class="card metric">ยอดขาย<b>฿${d.sales.toLocaleString()}</b></div><div class="card metric">คอมฯ พร้อมถอน<b>฿${d.commissionAvailable.toLocaleString()}</b></div></div><br><div class="card"><h2>ออเดอร์ล่าสุด</h2><table class="table"><thead><tr><th>Order</th><th>ยอดรวม</th><th>คอมมิชชัน</th><th>ชำระเงิน</th><th>วันที่</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${o.order_no}</td><td>฿${o.total.toLocaleString()}</td><td>฿${o.commission.toLocaleString()}</td><td>${o.payment_status}</td><td>${o.created_at}</td></tr>`).join('')}</tbody></table></div>`,'stats')}
async function wallet(){const d=await api('/api/wallet');shell(`<h1>Wallet & การถอนเงิน</h1><div class="grid4"><div class="card metric">พร้อมถอน<b>฿${d.wallet.available.toLocaleString()}</b></div><div class="card metric">รอปล่อย<b>฿${d.wallet.pending.toLocaleString()}</b></div><div class="card metric">จ่ายแล้ว<b>฿${d.wallet.paid.toLocaleString()}</b></div></div><br><div class="split"><div class="card"><h2>ขอถอนเงิน</h2><form id="wd" class="stack"><input name="amount" type="number" min="100" placeholder="จำนวนเงิน" required><select name="method"><option value="promptpay">PromptPay</option><option value="bank">บัญชีธนาคาร</option></select><input name="accountName" placeholder="ชื่อบัญชี" required><input name="accountNumber" placeholder="เลขบัญชี/เบอร์ PromptPay" required><button class="btn">ส่งคำขอถอน</button></form></div><div class="card"><h2>ประวัติถอน</h2>${d.withdrawals.map(w=>`<p><b>฿${w.amount.toLocaleString()}</b> — ${w.status}<br><span class="small muted">${w.created_at}</span></p>`).join('')||'<p class="muted">ยังไม่มีรายการ</p>'}</div></div>`,'wallet');$('#wd').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await api('/api/withdrawals',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});toast('ส่งคำขอถอนเงินแล้ว');wallet()}catch(x){toast(x.message)}}}
async function admin(){const s=await api('/api/admin/stats'),u=await api('/api/admin/users'),o=await api('/api/admin/orders'),p=await api('/api/admin/products'),w=await api('/api/admin/withdrawals');shell(`<h1>Admin Console</h1><div class="grid4"><div class="card metric">สมาชิก<b>${s.users}</b><span>รออนุมัติ ${s.pendingUsers}</span></div><div class="card metric">ออเดอร์<b>${s.orders}</b></div><div class="card metric">ยอดขาย<b>฿${s.sales.toLocaleString()}</b></div><div class="card metric">ถอนรอจัดการ<b>${s.withdrawals}</b></div></div><br><div class="tabs"><button class="active" onclick="adminTab('users')">สมาชิก</button><button onclick="adminTab('orders')">ออเดอร์</button><button onclick="adminTab('products')">สินค้า</button><button onclick="adminTab('withdrawals')">ถอนเงิน</button></div><div id="adminbody"></div>`,'admin');window.adminData={u,o,p,w};adminTab('users')}
window.adminTab=function(t){const d=window.adminData,b=$('#adminbody');if(t==='users')b.innerHTML=`<div class="card"><table class="table"><tr><th>สมาชิก</th><th>อีเมล</th><th>สถานะ</th><th>จัดการ</th></tr>${d.u.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.status}</td><td><button class="btn" onclick="setUser(${x.id},'approved')">อนุมัติ</button> <button class="btn danger" onclick="setUser(${x.id},'suspended')">ระงับ</button></td></tr>`).join('')}</table></div>`;if(t==='orders')b.innerHTML=`<div class="card"><table class="table"><tr><th>Order</th><th>สมาชิก</th><th>ยอด</th><th>Payment</th><th>สถานะ</th></tr>${d.o.map(x=>`<tr><td>${x.order_no}</td><td>${x.member||'-'}</td><td>฿${x.total.toLocaleString()}</td><td>${x.payment_status}</td><td><select onchange="setOrder(${x.id},this.value)"><option>${x.status}</option><option>confirmed</option><option>shipped</option><option>completed</option><option>cancelled</option></select></td></tr>`).join('')}</table></div>`;if(t==='products')b.innerHTML=`<div class="card"><h2>เพิ่มสินค้า</h2><form id="newp" class="split"><input name="name" placeholder="ชื่อสินค้า" required><input name="price" type="number" placeholder="ราคา" required><input name="commissionRate" type="number" step="0.1" placeholder="คอมมิชชัน %" required><input name="stock" type="number" placeholder="สต็อก"><input name="image" placeholder="URL รูปสินค้า"><textarea name="description" placeholder="รายละเอียด"></textarea><button class="btn">เพิ่มสินค้า</button></form><hr><table class="table"><tr><th>สินค้า</th><th>ราคา</th><th>คอมฯ</th><th>สต็อก</th></tr>${d.p.map(x=>`<tr><td>${x.name}</td><td>฿${x.price}</td><td>${x.commission_rate}%</td><td>${x.stock}</td></tr>`).join('')}</table></div>`;if(t==='withdrawals')b.innerHTML=`<div class="card"><table class="table"><tr><th>สมาชิก</th><th>จำนวน</th><th>วิธี</th><th>บัญชี</th><th>สถานะ</th><th></th></tr>${d.w.map(x=>`<tr><td>${x.member}</td><td>฿${x.amount}</td><td>${x.method}</td><td>${x.account_number}</td><td>${x.status}</td><td><select onchange="setWd(${x.id},this.value)"><option>${x.status}</option><option>processing</option><option>paid</option><option>rejected</option></select></td></tr>`).join('')}</table></div>`;const f=$('#newp');if(f)f.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/products',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('เพิ่มสินค้าแล้ว');admin()}catch(x){toast(x.message)}}}
window.setUser=async(id,status)=>{await api('/api/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});admin()};window.setOrder=async(id,status)=>{await api('/api/admin/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});toast('อัปเดตแล้ว')};window.setWd=async(id,status)=>{await api('/api/admin/withdrawals/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});toast('อัปเดตแล้ว');admin()};
function renderApp(){home()}boot();
</script></body></html>
